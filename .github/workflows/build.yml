name: Build & Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  VERSION: "0.1.0"

jobs:
  # ═══════════════════════════════════════════════════════
  # macOS Universal (Apple Silicon + Intel) — DMG
  # ═══════════════════════════════════════════════════════
  macos:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      run: brew install qt@6

    - name: Configure
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)"

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} -j$(sysctl -n hw.ncpu)

    - name: Test
      run: cd build && ctest --output-on-failure

    - name: Package
      run: cd build && cpack -G DragNDrop

    - uses: actions/upload-artifact@v4
      with:
        name: FreeEffect-${{ env.VERSION }}-macOS-universal.dmg
        path: build/*.dmg

  # ═══════════════════════════════════════════════════════
  # Linux x86_64 — DEB + RPM
  # ═══════════════════════════════════════════════════════
  linux-packages:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential pkg-config \
          qt6-base-dev libqt6svg6-dev libgl1-mesa-dev rpm

    - name: Configure
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCPACK_GENERATOR="DEB;RPM"

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} -j$(nproc)

    - name: Test
      run: cd build && ctest --output-on-failure

    - name: Package DEB
      run: cd build && cpack -G DEB

    - name: Package RPM
      run: cd build && cpack -G RPM

    - uses: actions/upload-artifact@v4
      with:
        name: FreeEffect-${{ env.VERSION }}-linux-x86_64
        path: |
          build/*.deb
          build/*.rpm

  # ═══════════════════════════════════════════════════════
  # Linux x86_64 — AppImage
  # ═══════════════════════════════════════════════════════
  linux-appimage:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential pkg-config \
          qt6-base-dev libqt6svg6-dev libgl1-mesa-dev \
          libfuse2 wget file

    - name: Build
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_INSTALL_PREFIX=/usr
        cmake --build build -j$(nproc)

    - name: Install to AppDir
      run: |
        cd build
        DESTDIR=$(pwd)/AppDir cmake --install .

    - name: Download linuxdeploy
      run: |
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
          -O /tmp/linuxdeploy
        chmod +x /tmp/linuxdeploy

    - name: Create AppImage
      run: |
        cd build
        /tmp/linuxdeploy \
          --appdir AppDir \
          --output appimage \
          --plugin qt || true
        ls -la *.AppImage 2>/dev/null || echo "No AppImage found"

    - uses: actions/upload-artifact@v4
      with:
        name: FreeEffect-${{ env.VERSION }}-linux-x86_64.AppImage
        path: build/*.AppImage

  # ═══════════════════════════════════════════════════════
  # Windows x64 — NSIS Installer
  # ═══════════════════════════════════════════════════════
  windows-x64:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qtsvg'

    - name: Configure
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }}

    - name: Test
      run: cd build && ctest --output-on-failure -C ${{ env.BUILD_TYPE }}

    - uses: actions/upload-artifact@v4
      with:
        name: FreeEffect-${{ env.VERSION }}-windows-x64
        path: build/bin/${{ env.BUILD_TYPE }}/FreeEffect.exe

  # ═══════════════════════════════════════════════════════
  # Release — attach all artifacts to GitHub Release
  # ═══════════════════════════════════════════════════════
  release:
    needs: [macos, linux-packages, linux-appimage, windows-x64]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/**/*.dmg
          artifacts/**/*.deb
          artifacts/**/*.rpm
          artifacts/**/*.AppImage
          artifacts/**/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
