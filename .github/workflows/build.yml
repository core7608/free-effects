name: Build & Package All Platforms

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  BUILD_TYPE: Release
  APP_NAME: FreeEffect
  VERSION: "0.1.0"

jobs:
  # ─────────────────────────────────────────────────────
  # macOS Universal Binary (Apple Silicon + Intel)
  # ─────────────────────────────────────────────────────
  macos-universal:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install cmake qt@6 pkg-config

    - name: Configure (Universal)
      run: |
        cmake -B build-universal -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
          -DCPACK_GENERATOR="DragNDrop"

    - name: Build
      run: cmake --build build-universal --config ${{ env.BUILD_TYPE }} -j$(sysctl -n hw.ncpu)

    - name: Test
      run: |
        cd build-universal
        ctest --output-on-failure

    - name: Package DMG
      run: |
        cd build-universal
        cpack -G DragNDrop -B ../packages

    - name: Upload macOS Universal DMG
      uses: actions/upload-artifact@v4
      with:
        name: FreeEffect-${{ env.VERSION }}-macOS-universal.dmg
        path: packages/*.dmg

  # ─────────────────────────────────────────────────────
  # macOS Apple Silicon (arm64)
  # ─────────────────────────────────────────────────────
  macos-arm64:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install cmake qt@6 pkg-config

    - name: Configure (arm64)
      run: |
        cmake -B build-arm64 -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_OSX_ARCHITECTURES="arm64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
          -DCPACK_GENERATOR="DragNDrop"

    - name: Build
      run: cmake --build build-arm64 --config ${{ env.BUILD_TYPE }} -j$(sysctl -n hw.ncpu)

    - name: Package DMG
      run: |
        cd build-arm64
        cpack -G DragNDrop -B ../packages

    - name: Upload macOS ARM64 DMG
      uses: actions/upload-artifact@v4
      with:
        name: FreeEffect-${{ env.VERSION }}-macOS-arm64.dmg
        path: packages/*.dmg

  # ─────────────────────────────────────────────────────
  # macOS Intel (x86_64)
  # ─────────────────────────────────────────────────────
  macos-x86_64:
    runs-on: macos-13
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install cmake qt@6 pkg-config

    - name: Configure (x86_64)
      run: |
        cmake -B build-x86_64 -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_OSX_ARCHITECTURES="x86_64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
          -DCPACK_GENERATOR="DragNDrop"

    - name: Build
      run: cmake --build build-x86_64 --config ${{ env.BUILD_TYPE }} -j$(sysctl -n hw.ncpu)

    - name: Package DMG
      run: |
        cd build-x86_64
        cpack -G DragNDrop -B ../packages

    - name: Upload macOS Intel DMG
      uses: actions/upload-artifact@v4
      with:
        name: FreeEffect-${{ env.VERSION }}-macOS-x86_64.dmg
        path: packages/*.dmg

  # ─────────────────────────────────────────────────────
  # Linux DEB + RPM (x86_64)
  # ─────────────────────────────────────────────────────
  linux-deb-rpm:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential pkg-config \
          qt6-base-dev libqt6svg6-dev libgl1-mesa-dev \
          rpm

    - name: Configure
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCPACK_GENERATOR="DEB;RPM"

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} -j$(nproc)

    - name: Test
      run: |
        cd build
        ctest --output-on-failure

    - name: Package DEB
      run: |
        cd build
        cpack -G DEB -B ../packages

    - name: Package RPM
      run: |
        cd build
        cpack -G RPM -B ../packages

    - name: Upload DEB
      uses: actions/upload-artifact@v4
      with:
        name: FreeEffect-${{ env.VERSION }}-linux-x86_64.deb
        path: packages/*.deb

    - name: Upload RPM
      uses: actions/upload-artifact@v4
      with:
        name: FreeEffect-${{ env.VERSION }}-linux-x86_64.rpm
        path: packages/*.rpm

  # ─────────────────────────────────────────────────────
  # Linux AppImage (x86_64)
  # ─────────────────────────────────────────────────────
  linux-appimage:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential pkg-config \
          qt6-base-dev libqt6svg6-dev libgl1-mesa-dev \
          libfuse2 wget file

    - name: Install linuxdeploy
      run: |
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O /usr/local/bin/linuxdeploy
        chmod +x /usr/local/bin/linuxdeploy
        wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O /usr/local/bin/linuxdeploy-plugin-qt
        chmod +x /usr/local/bin/linuxdeploy-plugin-qt

    - name: Configure
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DCMAKE_PREFIX_PATH="/usr/lib/x86_64-linux-gnu/cmake"

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} -j$(nproc)

    - name: Install to AppDir
      run: |
        cd build
        DESTDIR=AppDir cmake --install .

    - name: Create desktop entry
      run: |
        mkdir -p build/AppDir/usr/share/applications
        cat > build/AppDir/usr/share/applications/com.freeeffect.FreeEffect.desktop << EOF
        [Desktop Entry]
        Type=Application
        Name=FreeEffect
        Comment=Open-source motion graphics and compositing
        Exec=FreeEffect
        Icon=com.freeeffect.FreeEffect
        Categories=Graphics;2DGraphics;Video;
        MimeType=application/x-freeeffect-project;
        EOF

    - name: Create AppImage
      run: |
        cd build
        linuxdeploy --appdir AppDir \
          --plugin qt \
          --output appimage \
          --deploy-deps-only AppDir/usr/lib || true
        mv FreeEffect*.AppImage ../packages/FreeEffect-${{ env.VERSION }}-linux-x86_64.AppImage || true

    - name: Upload AppImage
      uses: actions/upload-artifact@v4
      with:
        name: FreeEffect-${{ env.VERSION }}-linux-x86_64.AppImage
        path: packages/*.AppImage

  # ─────────────────────────────────────────────────────
  # Windows x64 (NSIS Installer)
  # ─────────────────────────────────────────────────────
  windows-x64:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qtsvg'

    - name: Configure
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCPACK_GENERATOR="NSIS"

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }}

    - name: Test
      run: |
        cd build
        ctest --output-on-failure -C ${{ env.BUILD_TYPE }}

    - name: Package NSIS
      run: |
        cd build
        cpack -G NSIS -C ${{ env.BUILD_TYPE }} -B ../packages

    - name: Upload Windows x64 Installer
      uses: actions/upload-artifact@v4
      with:
        name: FreeEffect-${{ env.VERSION }}-windows-x64-setup.exe
        path: packages/*.exe

  # ─────────────────────────────────────────────────────
  # Windows x86 Legacy (32-bit, for older devices)
  # ─────────────────────────────────────────────────────
  windows-x86-legacy:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSVC (x86)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Install Qt (32-bit)
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qtsvg'
        dir: 'C:\Qt-x86'

    - name: Configure
      run: |
        cmake -B build-legacy -G "Visual Studio 17 2022" -A Win32 `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCPACK_GENERATOR="NSIS" `
          -DCMAKE_OSX_DEPLOYMENT_TARGET=""

    - name: Build
      run: cmake --build build-legacy --config ${{ env.BUILD_TYPE }}

    - name: Package
      run: |
        cd build-legacy
        cpack -G NSIS -C ${{ env.BUILD_TYPE }} -B ../packages

    - name: Upload Windows x86 Installer
      uses: actions/upload-artifact@v4
      with:
        name: FreeEffect-${{ env.VERSION }}-windows-x86-setup.exe
        path: packages/*.exe

  # ─────────────────────────────────────────────────────
  # Windows ARM64
  # ─────────────────────────────────────────────────────
  windows-arm64:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qtsvg'

    - name: Configure
      run: |
        cmake -B build-arm64 -G "Visual Studio 17 2022" -A ARM64 `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCPACK_GENERATOR="NSIS"

    - name: Build
      run: cmake --build build-arm64 --config ${{ env.BUILD_TYPE }}

    - name: Package
      run: |
        cd build-arm64
        cpack -G NSIS -C ${{ env.BUILD_TYPE }} -B ../packages

    - name: Upload Windows ARM64 Installer
      uses: actions/upload-artifact@v4
      with:
        name: FreeEffect-${{ env.VERSION }}-windows-arm64-setup.exe
        path: packages/*.exe

  # ─────────────────────────────────────────────────────
  # Release — attach all artifacts to GitHub Release
  # ─────────────────────────────────────────────────────
  release:
    needs: [macos-universal, macos-arm64, macos-x86_64, linux-deb-rpm, linux-appimage, windows-x64, windows-x86-legacy, windows-arm64]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/FreeEffect-*.dmg
          artifacts/FreeEffect-*.deb
          artifacts/FreeEffect-*.rpm
          artifacts/FreeEffect-*.AppImage
          artifacts/FreeEffect-*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
